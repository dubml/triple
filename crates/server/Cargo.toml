[package]
name = "triple-server"
edition.workspace = true
license.workspace = true
publish = false

[[example]]
name = "server"
path = "fake/server.rs"

[[example]]
name = "grpc_client"
path = "fake/grpc_client.rs"

[dependencies]
triple-http = { path = "../http" }
triple-rpc = { path = "../rpc" }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http.workspace = true
http-body-util = "0.1"
bytes.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls.workspace = true
thiserror.workspace = true
libc = "0.2"

[dev-dependencies]
protos = { path = "../protos" }
tonic = "=0.14.6"
rcgen = "0.14"
hyper = { version = "1", features = ["client"] }
prost.workspace = true
serde_json = "1"
triple-core = { path = "../core" }
triple-transport = { path = "../transport" }
hpack = "0.3"

[lints]
workspace = true
