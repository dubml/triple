[workspace]
members = ["crates/core", "crates/codec", "crates/headers", "crates/transport", "crates/rpc", "crates/rpc-interop", "crates/http", "crates/server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
h2 = "0.4"
http = "1"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
